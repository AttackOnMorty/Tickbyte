<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tickbyte 1440×900</title>
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("../../Tickbyte/Fonts/SpaceGrotesk.ttf") format("truetype");
      font-weight: 400 700;
    }
    @font-face {
      font-family: "Space Mono";
      src: url("../../Tickbyte/Fonts/SpaceMono-Regular.ttf") format("truetype");
      font-weight: 400;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1440px; height: 900px; overflow: hidden; }
    body {
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      padding: 57px 90px 57px 96px;
      background: #F5F4F1;
      color: #111;
    }

    .brand { flex: 1 1 auto; min-width: 0; padding-right: 48px; }
    .identity {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 104px;
    }
    .identity img {
      width: 84px;
      height: 84px;
      border-radius: 16px;
    }
    .identity span {
      font-family: "Space Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }
    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 80px;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 0.9;
      text-transform: uppercase;
    }
    .lede {
      margin-top: 123px;
      font-family: "Space Mono", monospace;
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8A8680;
    }

    .panel {
      flex: 0 0 465px;
      width: 465px;
      display: flex;
      flex-direction: column;
      padding: 36px 36px 28px;
      background: #F8F8F8;
      border: 1px solid #D8D8D8;
      border-radius: 16px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .pair, .compact-pair, .quit {
      font-family: "Space Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8A8680;
    }
    .change {
      font-family: "Space Mono", monospace;
      font-size: 20px;
      color: #D71921;
    }
    .hero-price {
      margin-top: 12px;
      font-family: "Space Mono", monospace;
      font-size: 64px;
      line-height: 1.02;
    }
    .chart { margin-top: 24px; }
    .chart svg { width: 100%; height: 56px; display: block; }
    .compact {
      display: flex;
      align-items: center;
      min-height: 56px;
      margin-top: auto;
    }
    .compact-pair { flex: 1; }
    .compact-price {
      font-family: "Space Mono", monospace;
      font-size: 22px;
      margin-right: 16px;
    }
    .compact-change {
      font-family: "Space Mono", monospace;
      font-size: 13px;
      color: #D71921;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 32px;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <section class="brand">
    <div class="identity">
      <img src="../../Tickbyte/AppIcon.icon/Assets/AppIcon-1024.png" alt="" />
      <span>TICKBYTE</span>
    </div>
    <h1>Live crypto.<br>Right in your<br>menu bar.</h1>
    <p class="lede">See BTC + ETH move in real time.</p>
  </section>

  <aside class="panel">
    <div class="row">
      <span class="pair">BTC/USDT</span>
      <span class="change">+0.30%</span>
    </div>
    <div class="hero-price">64,556</div>
    <div class="chart">
      <svg viewBox="0 0 400 56" preserveAspectRatio="none">
        <polyline
          fill="none"
          stroke="#111"
          stroke-width="1.6"
          stroke-linejoin="round"
          stroke-linecap="round"
          points="0,38 12,34 24,32 36,33 48,24 60,28 72,20 84,26 96,18 108,22 120,16 132,24 144,20 156,32 168,28 180,36 192,30 204,38 216,32 228,28 240,30 252,24 264,26 276,20 288,22 300,16 312,20 324,14 336,18 348,12 360,16 372,10 384,14 400,12"
        />
        <circle cx="400" cy="12" r="2.4" fill="#111" />
      </svg>
    </div>
    <div class="compact">
      <span class="compact-pair">ETH/USDT</span>
      <span class="compact-price">1,889</span>
      <span class="compact-change">+0.83%</span>
    </div>
    <div class="footer">
      <span class="quit">[ QUIT ]</span>
    </div>
  </aside>
</body>
</html>
